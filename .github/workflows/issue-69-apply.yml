name: Issue 69 temporary executor

on:
  push:
    branches:
      - issue-69-commands-default

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply command vocabulary cut
        run: python3 tools/issue69_apply.py

      - name: Format candidate
        run: cargo fmt --all

      - name: Regenerate affected trybuild diagnostics and test workspace
        env:
          TRYBUILD: overwrite
        run: cargo test --workspace --locked

      - name: Commit candidate without temporary executor files
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/issue-69-apply.yml tools/issue69_apply.py
          if rg -n '\b(TransferableCommands|TransferableBatchCommands)\b' crates/runen-ecs conformance docs; then
            echo 'obsolete public command names remain' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize deferred command authoring vocabulary (#69)'

      - name: Validate clean committed candidate
        run: |
          set -euo pipefail
          cargo test -p runen-ecs --test commands --locked
          cargo test -p runen-ecs --test system_param_mobility --locked
          cargo test -p runen-ecs --test public_api_boundary --locked
          cargo run -p runen-ecs --example deferred_commands --locked
          cargo run -p runen-ecs --example system_mobility --locked
          cargo run -p runen-ecs --example standalone_simulation --locked
          cargo validate
          git diff HEAD^ --check
          test -z "$(git status --porcelain)"

      - name: Publish validated candidate branch
        run: git push origin HEAD:issue-69-commands-default
