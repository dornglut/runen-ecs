[package]
name = "runen-ecs-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license.workspace = true
description = "Derive macros for the standalone RunenECS framework."
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
